agent_id: "local-dev-agent"
environment: "development"
workspace_path: "./workspace"
log_level: "info"

deployments:
  local-test:
    repository_path: "."

    steps:
      - type: "git_pull"

      - type: "shell"
        name: "git_status"
        command: "git"
        arguments:
          - "status"
          - "--short"

      - type: "shell"
        name: "print_environment"
        command: "env"

