agent_id: "local-dev-agent"
environment: "development"
workspace_path: "./workspace"
log_level: "info"

deployments:
  happy-path:
    repository_path: "."

    steps:
      - type: "git_pull"

      - type: "shell"
        name: "print_environment"
        command: "env"

      - type: "shell"
        name: "git_status"
        command: "git"
        arguments:
          - "status"
          - "--short"

  timeout-test:
    repository_path: "."

    steps:
      - type: "shell"
        name: "sleep_test"
        command: "sleep"
        arguments:
          - "10"
        timeout_seconds: 2

  failure-test:
    repository_path: "."

    steps:
      - type: "shell"
        name: "successful_step"
        command: "echo"
        arguments:
          - "hello"

      - type: "shell"
        name: "failing_step"
        command: "false"

      - type: "shell"
        name: "should_not_run"
        command: "echo"
        arguments:
          - "this should never execute"

  retry-test:
    repository_path: "."

    steps:
      - type: "shell"
        name: "retry_failure"
        command: "false"
        retries: 2
        retry_delay_seconds: 1

  pm2-validation-test:
    repository_path: "."

    steps:
      - type: "pm2_restart"
        process_name: "test-app"

  case npm-install-test:
    repository_path: "."

    steps:
      -type: "npm_install"